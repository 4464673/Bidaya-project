<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Config integrated directly from your project
    const firebaseConfig = {
        apiKey: "AIzaSyCzRmE2cu2voK-2Dm7GHEuiKNyN22Gzp0k",
        authDomain: "bidayaapp-49574.firebaseapp.com",
        projectId: "bidayaapp-49574",
        storageBucket: "bidayaapp-49574.firebasestorage.app",
        messagingSenderId: "803336177427",
        appId: "1:803336177427:web:0c88c2ebfcb631cda73ce6",
        measurementId: "G-QDLJCL5ZGC"
    };

    const navAuthContainer = document.getElementById("nav-auth-container");
    const centerAuthContainer = document.getElementById("center-auth-container");
    const welcomeTitle = document.getElementById("welcome-title");
    const welcomeSubtitle = document.getElementById("welcome-subtitle");
    const authError = document.getElementById("auth-error");

    function showAuthError(message) {
        authError.textContent = message;
        authError.style.display = "block";
    }

    function clearAuthError() {
        authError.style.display = "none";
        authError.textContent = "";
    }

    if (window.location.protocol === "file:") {
        welcomeTitle.textContent = "Can't sign in from a local file";
        welcomeSubtitle.textContent = "";
        showAuthError("This page was opened directly from your computer (file://...). Google Sign-In needs a real web address to work — open this through Live Server in VSCode, or visit the live GitHub Pages link instead of double-clicking the file.");
        navAuthContainer.innerHTML = "";
        centerAuthContainer.innerHTML = "";
    } else {
        initAuth();
    }

    function initAuth() {
        let app, auth, provider;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();
        } catch (error) {
            console.error("Firebase failed to initialize:", error);
            welcomeTitle.textContent = "Sign-in is unavailable";
            showAuthError("Something went wrong loading Google Sign-In. Please refresh the page.");
            return;
        }

        const stuckTimer = setTimeout(() => {
            if (welcomeTitle.textContent === "Loading...") {
                welcomeTitle.textContent = "Sign-in is taking too long";
                showAuthError("If this doesn't resolve, your browser may be blocking third-party cookies/storage. Try a different browser or disable strict tracking protection for this site.");
            }
        }, 6000);

        // Uses a popup instead of a full-page redirect — redirect-based sign-in
        // depends on the browser preserving storage across a navigation away to
        // Google and back, which modern Chrome/Firefox increasingly block for
        // privacy reasons (silently, with no error). A popup avoids that entirely.
        function handleSignIn() {
            clearAuthError();
            signInWithPopup(auth, provider).catch((error) => {
                console.error("signInWithPopup failed:", error);
                if (error.code === "auth/unauthorized-domain") {
                    showAuthError("This website's domain isn't authorized for sign-in yet. In the Firebase console, go to Authentication → Settings → Authorized domains, and add this site's domain.");
                } else if (error.code === "auth/popup-blocked") {
                    showAuthError("Your browser blocked the sign-in popup. Allow popups for this site and try again.");
                } else if (error.code === "auth/popup-closed-by-user" || error.code === "auth/cancelled-popup-request") {
                    // User closed the popup themselves — not a real error.
                } else {
                    showAuthError("Sign-in didn't go through (" + error.code + "). Please try again.");
                }
            });
        }

        function handleSignOut() {
            signOut(auth).catch((error) => {
                console.error("Sign out failed:", error);
                showAuthError("Sign-out didn't go through. Please try again.");
            });
        }

        onAuthStateChanged(auth, (user) => {
            clearTimeout(stuckTimer);
            navAuthContainer.innerHTML = "";
            centerAuthContainer.innerHTML = "";

            const navBtn = document.createElement("button");
            navBtn.className = "auth-btn";

            const centerBtn = document.createElement("button");
            centerBtn.className = "auth-btn";
            centerBtn.style.padding = "10px 24px";
            centerBtn.style.fontSize = "16px";

            if (user) {
                welcomeTitle.textContent = `Welcome, ${user.displayName || "Student"}!`;
                welcomeSubtitle.textContent = "Successfully logged in with Google.";

                navBtn.textContent = "Sign Out";
                navBtn.classList.add("btn-signout");
                navBtn.onclick = handleSignOut;

                centerBtn.textContent = "Sign Out";
                centerBtn.classList.add("btn-signout");
                centerBtn.onclick = handleSignOut;
            } else {
                welcomeTitle.textContent = "Sign in to your account";
                welcomeSubtitle.textContent = "Sign in with your real Google account to access class materials.";

                navBtn.textContent = "Sign in with Google";
                navBtn.classList.add("btn-signin");
                navBtn.onclick = handleSignIn;

                centerBtn.textContent = "Sign in with Google";
                centerBtn.classList.add("btn-signin");
                centerBtn.onclick = handleSignIn;
            }

            navAuthContainer.appendChild(navBtn);
            centerAuthContainer.appendChild(centerBtn);
        });
    } // end initAuth()

    // Card buttons: show a "coming soon" note instead of a dead link
    document.querySelectorAll(".card-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
            const note = btn.nextElementSibling;
            if (note && note.classList.contains("card-note")) {
                note.style.display = note.style.display === "block" ? "none" : "block";
            }
        });
    });

    // Arabic alphabet grid
    const alphabet = [
        ["ا", "Alif", "a"], ["ب", "Ba", "b"], ["ت", "Ta", "t"], ["ث", "Tha", "th"],
        ["ج", "Jim", "j"], ["ح", "Ha", "ḥ"], ["خ", "Kha", "kh"], ["د", "Dal", "d"],
        ["ذ", "Dhal", "dh"], ["ر", "Ra", "r"], ["ز", "Zay", "z"], ["س", "Sin", "s"],
        ["ش", "Shin", "sh"], ["ص", "Sad", "ṣ"], ["ض", "Dad", "ḍ"], ["ط", "Ta", "ṭ"],
        ["ظ", "Za", "ẓ"], ["ع", "Ayn", "ʿ"], ["غ", "Ghayn", "gh"], ["ف", "Fa", "f"],
        ["ق", "Qaf", "q"], ["ك", "Kaf", "k"], ["ل", "Lam", "l"], ["م", "Mim", "m"],
        ["ن", "Nun", "n"], ["ه", "Ha", "h"], ["و", "Waw", "w"], ["ي", "Ya", "y"]
    ];
    const grid = document.getElementById("alphabet-grid");
    alphabet.forEach(([letter, name, translit]) => {
        const el = document.createElement("div");
        el.className = "letter-card";
        el.innerHTML = `
            <div class="letter-ar">${letter}</div>
            <div class="letter-name">${name}</div>
            <div class="letter-translit">${translit}</div>
        `;
        grid.appendChild(el);
    });
</script>
